name: Build & Deploy yuuublog

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_backend:
        description: '强制重建并部署后端 jar'
        type: boolean
        default: false
      force_admin:
        description: '强制重建并部署后台 dist'
        type: boolean
        default: false
      deploy_frontend:
        description: '同时部署前台门户 dist'
        type: boolean
        default: false

concurrency:
  # 组名带版本后缀：历史上出现过单次部署僵死 2 小时、长期占用队列且无法取消的情况，
  # 换组名即可让新任务绕开被占用的旧组（旧任务自然结束后可再改回或保留）
  group: yuuublog-deploy-v2
  cancel-in-progress: false

env:
  # 服务器上的部署根目录（与 nginx.conf / systemd unit 保持一致）
  DEPLOY_ROOT: /app/blog/blog/app/app
  # 上传暂存目录（保留上次上传的 jar 作为 rsync 增量基准，勿删）
  STAGE_DIR: /app/deploy/incoming

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.flags.outputs.backend }}
      admin: ${{ steps.flags.outputs.admin }}
      frontend: ${{ steps.flags.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # paths-filter 需要与上一个 commit 做 diff
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            admin:
              - 'admin/**'
            frontend:
              - 'frontend/**'
      - name: Resolve build flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            B="${{ inputs.force_backend }}"
            A="${{ inputs.force_admin }}"
            F="${{ inputs.deploy_frontend }}"
          else
            B="${{ steps.filter.outputs.backend }}"
            A="${{ steps.filter.outputs.admin }}"
            F="${{ steps.filter.outputs.frontend }}"
          fi
          echo "backend=$B" >> "$GITHUB_OUTPUT"
          echo "admin=$A" >> "$GITHUB_OUTPUT"
          echo "frontend=$F" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
      - name: Maven package
        run: mvn -B -ntp -DskipTests -f backend/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            backend/yuuu-admin/target/yuuu-admin.jar
            backend/yuuu-blog/target/yuuu-blog.jar
          if-no-files-found: error

  admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm
          cache-dependency-path: admin/package.json
      - name: Build admin dist
        # package-lock.json 的 tarball 地址已统一修正为 registry.npmjs.org（原淘宝/nlark 镜像证书已过期）
        run: |
          cd admin
          npm install --no-audit --no-fund
          npm run build:prod
      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist
          if-no-files-found: error

  frontend:
    # 改了 frontend/** 就自动重建部署；也可手动 Run workflow 勾选 deploy_frontend 强制部署
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Build frontend dist
        # --legacy-peer-deps：老项目依赖树有历史 peer 冲突，npm 7+ 默认会直接 ERESOLVE 报错
        run: |
          cd frontend
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy:
    needs: [changes, backend, admin, frontend]
    if: always() && (needs.backend.result == 'success' || needs.admin.result == 'success' || needs.frontend.result == 'success')
    runs-on: ubuntu-latest
    # 跨境上传曾出现单次跑 2 小时仍不结束、并长期占用 concurrency 组的情况，
    # 这里设上限让它失败并释放队列（classes 增量改造后正常应在几分钟内完成）
    timeout-minutes: 45
    steps:
      # deploy 只下载产物，工作区里没有仓库文件；update_jar.py 需要从仓库取，必须先 checkout
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT}" -H "${SERVER_HOST}" >> ~/.ssh/known_hosts
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
      - name: Upload artifacts
        # rsync -rlpt 是必须的：早期版本漏了 -r，目录型产物（dist）只会输出
        # "skipping directory ."，静默什么都不传，前台/后台 dist 永远停留在旧版本。
        # jar 额外加 --inplace：Spring Boot jar 内依赖库基本不变，只传差异块，
        # 跨境链路上比 scp 全量快 1~2 个数量级；暂存区必须保留旧 jar 作为增量基准。
        run: |
          set -e
          ls -la artifacts/ || true
          HAS_ADMIN=0; HAS_FRONT=0
          if [ -d artifacts/admin-dist ]; then HAS_ADMIN=1; fi
          if [ -d artifacts/frontend-dist ]; then HAS_FRONT=1; fi
          JAR_ADMIN=$(find artifacts/backend-jars -name 'yuuu-admin.jar' 2>/dev/null | head -1)
          JAR_BLOG=$(find artifacts/backend-jars -name 'yuuu-blog.jar' 2>/dev/null | head -1)
          echo "flags: admin=$HAS_ADMIN frontend=$HAS_FRONT jar_admin=${JAR_ADMIN:-none} jar_blog=${JAR_BLOG:-none}"
          if [ "$HAS_ADMIN" = "0" ] && [ "$HAS_FRONT" = "0" ] && [ -z "$JAR_ADMIN" ] && [ -z "$JAR_BLOG" ]; then
            echo "nothing to deploy"; exit 1
          fi
          R="rsync -e \"ssh -p ${SSH_PORT}\" -rlptz --inplace --partial --timeout 600"
          ssh -p "${SSH_PORT}" "${SERVER_USER}@${SERVER_HOST}" "mkdir -p ${STAGE_DIR}/{admin,frontend,jars}"
          if [ "$HAS_ADMIN" = "1" ]; then
            eval "$R artifacts/admin-dist/ \"${SERVER_USER}@${SERVER_HOST}:${STAGE_DIR}/admin/\""
            ssh -p "${SSH_PORT}" "${SERVER_USER}@${SERVER_HOST}" "ls -la ${STAGE_DIR}/admin/ | head -5"
          fi
          # 上传 jar 更新脚本（服务器重建 fat jar 用，无嵌套 heredoc 风险）
          eval "$R .github/scripts/update_jar.py \"${SERVER_USER}@${SERVER_HOST}:${STAGE_DIR}/update_jar.py\""

          # fat jar 约 100MB+，跨境链路全量上传要 1 小时以上。
          # 依赖（BOOT-INF/lib）没变时，只上传 BOOT-INF/classes（几百 KB），由服务器本地重建 jar。
          # 用 pom.xml 指纹判断依赖是否变化（比解析远端 jar 的 zip 列表更稳）
          POM_FP=$(find backend -name pom.xml | sort | xargs md5sum | md5sum | awk '{print $1}')
          ssh -p "${SSH_PORT}" "${SERVER_USER}@${SERVER_HOST}" \
            "cat ${STAGE_DIR}/poms.md5 2>/dev/null || echo none" > /tmp/remote_poms.txt 2>/dev/null || echo none > /tmp/remote_poms.txt
          REMOTE_FP=$(head -1 /tmp/remote_poms.txt | tr -d '\r')
          echo "pom fingerprint: local=$POM_FP remote=$REMOTE_FP"
          if [ "$POM_FP" = "$REMOTE_FP" ]; then DEPS_CHANGED=0; else DEPS_CHANGED=1; fi
          echo "deps_changed=$DEPS_CHANGED"

          upload_jar() {
            local jar="$1" name="$2" remote="$3"
            if [ "$DEPS_CHANGED" = "1" ]; then
              echo "[$name] 依赖有变化或远端无 jar -> 整包上传"
              eval "$R \"$jar\" \"${SERVER_USER}@${SERVER_HOST}:${STAGE_DIR}/jars/${name}.jar\""
              echo "JAR_FULL_${name}=1" >> "$GITHUB_ENV"
            else
              echo "[$name] 依赖未变化 -> 只上传 BOOT-INF/classes"
              local tmpd="/tmp/${name}_classes"
              rm -rf "$tmpd"; mkdir -p "$tmpd"
              unzip -q -o "$jar" 'BOOT-INF/classes/*' -d "$tmpd"
              # rsync 不会自动创建多级父目录，classes 目录必须先建
              ssh -p "${SSH_PORT}" "${SERVER_USER}@${SERVER_HOST}" "mkdir -p ${STAGE_DIR}/classes/${name}"
              # --delete：CI 侧删掉的类不在目标端残留，否则会被重新写回 jar
              eval "$R --delete ${tmpd}/BOOT-INF/ \"${SERVER_USER}@${SERVER_HOST}:${STAGE_DIR}/classes/${name}/\""
              echo "JAR_FULL_${name}=0" >> "$GITHUB_ENV"
            fi
          }

          if [ -n "$JAR_ADMIN" ]; then
            upload_jar "$JAR_ADMIN" yuuu-admin "${DEPLOY_ROOT}/backend/yuuu-admin.jar"
          fi
          if [ -n "$JAR_BLOG" ]; then
            upload_jar "$JAR_BLOG" yuuu-blog "${DEPLOY_ROOT}/front/yuuu-blog.jar"
          fi
          # 记录本次部署对应的 pom 指纹，作为下次是否为增量部署的依据
          echo "$POM_FP" | ssh -p "${SSH_PORT}" "${SERVER_USER}@${SERVER_HOST}" "cat > ${STAGE_DIR}/poms.md5"
          echo "poms.md5 updated: $POM_FP"
          if [ "$HAS_FRONT" = "1" ]; then
            eval "$R artifacts/frontend-dist/ \"${SERVER_USER}@${SERVER_HOST}:${STAGE_DIR}/frontend/\""
            ssh -p "${SSH_PORT}" "${SERVER_USER}@${SERVER_HOST}" "ls -la ${STAGE_DIR}/frontend/ | head -5"
          fi
          echo "HAS_ADMIN=$HAS_ADMIN" >> "$GITHUB_ENV"
          echo "HAS_FRONT=$HAS_FRONT" >> "$GITHUB_ENV"
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
      - name: Apply on server
        run: |
          ssh -p "${SSH_PORT}" "${SERVER_USER}@${SERVER_HOST}" "bash -s ${{ env.HAS_ADMIN || '0' }} ${{ env.HAS_FRONT || '0' }}" <<'REMOTE'
          set -e
          # 注意：远端脚本不继承 Actions 的 env，这里必须写死；$1/$2 由 ssh 命令行传入
          DEPLOY_ROOT=/app/blog/blog/app/app
          STAGE=/app/deploy/incoming
          ADMIN_UPLOADED=${1:-0}
          FRONT_UPLOADED=${2:-0}
          TS=$(date +%s)
          BK=/app/deploy/backup/$TS
          mkdir -p "$BK"

          # 1) 后台 dist（仅本次确实上传了才部署，避免把上次残留的暂存区重复覆盖上线）
          if [ "$ADMIN_UPLOADED" = "1" ]; then
            if [ ! -f "$STAGE/admin/index.html" ]; then echo "admin dist MISSING in stage"; exit 1; fi
            cp -a "$DEPLOY_ROOT/backend/dist" "$BK/backend-dist" 2>/dev/null || true
            rsync -a "$STAGE/admin/" "$DEPLOY_ROOT/backend/dist/"
            echo "admin dist deployed"
          fi

          # 2) 前台 dist（仅本次确实上传了才部署）
          if [ "$FRONT_UPLOADED" = "1" ]; then
            if [ ! -f "$STAGE/frontend/index.html" ]; then echo "frontend dist MISSING in stage"; exit 1; fi
            cp -a "$DEPLOY_ROOT/front/dist" "$BK/front-dist" 2>/dev/null || true
            rsync -a "$STAGE/frontend/" "$DEPLOY_ROOT/front/dist/"
            echo "frontend dist deployed"
            stat -c 'index.html -> %y' "$DEPLOY_ROOT/front/dist/index.html"
            grep -rq "data-theme" "$DEPLOY_ROOT/front/dist/static/css/" || echo "WARN: 设计系统样式未出现在产物中"
          fi

          # 3) jar：整包优先，其次用上传的 BOOT-INF/classes 本地增量重建
          JAR_ADMIN=$(find "$STAGE/jars" -name 'yuuu-admin.jar' 2>/dev/null | head -1)
          JAR_BLOG=$(find "$STAGE/jars" -name 'yuuu-blog.jar' 2>/dev/null | head -1)
          APPLIED=0
          apply_jar() {
            local name="$1" dir="$2" full="$3"
            local jar="$dir/$name.jar"
            local classes="$STAGE/classes/$name/BOOT-INF/classes"
            if [ -n "$full" ]; then
              cp -a "$jar" "$BK/" 2>/dev/null || true
              cp -f "$full" "$jar"
              # 用后即删：否则下次只传 classes 时会被残留的旧整包覆盖回去
              rm -f "$full"
              echo "$name: 整包替换"
              APPLIED=1
            elif [ -d "$classes" ]; then
              cp -a "$jar" "$BK/" 2>/dev/null || true
              python3 "$STAGE/update_jar.py" "$jar" "$classes" || { echo "$name: 增量重建失败，回滚"; cp -f "$BK/$name.jar" "$jar"; return 1; }
              echo "$name: classes 增量更新"
              APPLIED=1
            fi
          }
          if [ -n "$JAR_ADMIN" ] || [ -n "$JAR_BLOG" ] || [ -d "$STAGE/classes/yuuu-admin/BOOT-INF/classes" ] || [ -d "$STAGE/classes/yuuu-blog/BOOT-INF/classes" ]; then
            systemctl stop yuuu-admin yuuu-blog || true
            apply_jar yuuu-admin "$DEPLOY_ROOT/backend" "$JAR_ADMIN"
            apply_jar yuuu-blog "$DEPLOY_ROOT/front" "$JAR_BLOG"
            systemctl start yuuu-blog yuuu-admin
            RESTARTED=1
          else
            echo "no jar updates, skip restart"
            RESTARTED=0
          fi

          # 4) config 目录必须保留（外部配置，不在仓库里）
          ls "$DEPLOY_ROOT/backend/config" "$DEPLOY_ROOT/front/config" >/dev/null

          # 5) 健康检查（仅在有 jar 更新时；注意：前台 API 没有根路由，必须用真实接口）
          if [ "$RESTARTED" = "1" ]; then
            for i in $(seq 1 30); do
              sleep 4
              if curl -sf -o /dev/null http://127.0.0.1:8989/ && \
                 curl -sf -o /dev/null "http://127.0.0.1:7777/category/getCategoryList"; then
                echo "healthcheck OK"; break
              fi
              [ $i -eq 30 ] && { echo "healthcheck FAILED"; journalctl -u yuuu-admin -u yuuu-blog -n 60 --no-pager; exit 1; }
            done
          fi
          curl -sf "https://www.yuuu.online/api/category/getCategoryList" | head -c 200; echo

          # 前台 dist 冒烟：首页必须可取到（防止 rsync 目标目录错/资源未同步）
          curl -sf -o /dev/null -w "frontend / -> %{http_code}\n" https://www.yuuu.online/ || echo "frontend smoke WARN"

          # 后台 dist 冒烟：index.html 引用的 js 必须能取到（防 publicPath 配错导致全站 404 白屏）
          if [ "$ADMIN_UPLOADED" = "1" ]; then
            JS=$(curl -sf https://www.yuuu.online:8094/ | grep -o '/static/js/app\.[^"]*\.js' | head -1)
            if [ -z "$JS" ]; then echo "admin dist smoke FAILED: no app.js in index.html"; exit 1; fi
            curl -sf -o /dev/null -w "admin asset $JS -> %{http_code}\n" "https://www.yuuu.online:8094$JS"
          fi

          echo "backup: $BK"
          REMOTE
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
