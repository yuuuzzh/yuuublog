server:
  port: 7777
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/yuuu_blog?characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 5MB
  redis:
    host: 192.168.202.128
    password:
    database: 5

mybatis-plus:
  configuration:
    # 日志
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
oss:
  accessKey: YOUR_OSS_ACCESS_KEY
  secretKey: YOUR_OSS_SECRET_KEY
  bucket: YOUR_OSS_BUCKET
mail:
  smsTemplateDir: "templates/mail/sms"
  replyTemplateDir: "templates/mail/reply"
  username: YOUR_MAIL_USERNAME